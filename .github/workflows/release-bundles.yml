name: release-bundles

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"

      - name: Verify tag matches CLI version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./cli/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match CLI version $VERSION" >&2
            exit 1
          fi

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build release bundles
        working-directory: cli
        run: npm run build:bundle -- --all

      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: |
            cli/release/*.tar.gz
            cli/release/*.zip
            cli/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: release

      - name: Verify release bundles and checksums
        working-directory: release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          expected="$(
            {
              for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
                echo "grclanker-${VERSION}-${target}.tar.gz"
              done
              for target in win32-arm64 win32-x64; do
                echo "grclanker-${VERSION}-${target}.zip"
              done
            } | sort
          )"
          present="$(find . -type f -printf '%P\n' | grep -vx 'SHA256SUMS.txt' | sort)"
          listed="$(awk '{ print $2 }' SHA256SUMS.txt | sort)"
          if [ "$present" != "$expected" ] || [ "$listed" != "$expected" ]; then
            echo "::error::Release files or SHA256SUMS.txt entries do not match the six expected bundles"
            echo "Expected:"; echo "$expected"
            echo "Present:"; echo "$present"
            echo "Listed in SHA256SUMS.txt:"; echo "$listed"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS.txt

      - name: Refuse to replace published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if count="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null)" \
            && [ "$count" -gt 0 ]; then
            echo "::error::Release $GITHUB_REF_NAME already has $count assets. Delete them before re-running so the published checksums and attestations describe the same files."
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: GRC Clanker ${{ github.ref_name }} (Experimental)
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            First public experimental CLI release for grclanker.

            grclanker is an open source AI GRC CLI built on top of Pi. `0.0.1` is the first public bundle line and should be treated like an experimental prerelease: usable, but still moving quickly.

            ## Highlights

            - Bundled runtime installers for macOS, Linux, and Windows release targets
            - Real setup flow with `grclanker setup`
            - Local-first path for Ollama-compatible models, with Gemma 4 as the documented default example
            - Explicit hosted-model path instead of silent fallback behavior
            - Current workflow rails:
              - `/investigate`
              - `/audit`
              - `/assess`
              - `/validate`
            - Repo specs can be used as build inputs by the CLI
            - Dedicated runtime state under `~/.grclanker/agent`

            ## Install

            macOS / Linux:

            ```bash
            curl -fsSL https://grclanker.com/install | bash
            grclanker setup
            ```

            Windows PowerShell:

            ```powershell
            powershell -ExecutionPolicy Bypass -c "irm https://grclanker.com/install.ps1 | iex"
            grclanker setup
            ```

            Full docs:
            - https://grclanker.com/docs/getting-started/installation
            - https://grclanker.com/docs/getting-started/setup

            ## Verify a download

            Every archive is listed in `SHA256SUMS.txt` and has a GitHub build provenance attestation:

            ```bash
            sha256sum --check --ignore-missing SHA256SUMS.txt
            gh attestation verify grclanker-<version>-<target>.tar.gz --repo ${{ github.repository }}
            ```

            ## Validation notes

            - macOS bundle build, install flow, and launcher smoke-tested locally
            - Windows ARM bundle build, installer, and launcher smoke-tested in a disposable Parallels Windows 11 ARM clone
            - Windows remains best-effort for `0.0.1`, even though the installer path was validated

            ## Known release posture

            - macOS and Linux are the recommended platforms for this release
            - Windows support is present but not a priority yet
            - Breaking changes are still likely while the runtime, setup flow, and workflows settle
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS.txt
