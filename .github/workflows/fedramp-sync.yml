name: fedramp-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"

      - name: Install site dependencies
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Sync official FedRAMP sources
        run: npm run sync:fedramp
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Workflows on PRs opened with GITHUB_TOKEN do not run automatically and
      # may wait for approval, so the sync must pass the CLI tests and site
      # build before the PR is opened.
      - name: Test CLI
        working-directory: cli
        run: npm run test:cli

      - name: Build site
        run: npm run build

      - name: Write the sync patch
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/fedramp-sync.patch"

      - name: Upload the sync patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fedramp-sync-patch
          path: ${{ runner.temp }}/fedramp-sync.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  # The only job with a write token. It must not install dependencies or run
  # repo code, so the token never reaches the npm dependency tree.
  open-pr:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the sync patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fedramp-sync-patch
          path: ${{ runner.temp }}/fedramp-sync

      - name: Apply the sync patch
        run: |
          patch="$RUNNER_TEMP/fedramp-sync/fedramp-sync.patch"
          test -f "$patch"
          if [ -s "$patch" ]; then
            git apply --index "$patch"
          else
            echo "The sync changed no files."
          fi

      - name: Open reviewed sync PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/fedramp-sync
          commit-message: "chore: sync official FedRAMP sources"
          title: "chore: sync official FedRAMP sources"
          body: |
            Syncs grclanker's generated FedRAMP docs snapshot from the official FedRAMP GitHub sources.

            - Refreshes generated docs from the official FedRAMP Consolidated Rules
            - Preserves reviewed snapshot delivery for the site
            - Keeps CLI lookups and docs content aligned to the same upstream source

            This PR was opened automatically by the `fedramp-sync` workflow.
          labels: |
            automation
            documentation
