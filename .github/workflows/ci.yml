name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-tests:
    name: cli-tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build CLI TypeScript
        working-directory: cli
        run: npm run build

      # The PowerShell installer tests skip when pwsh is missing, so a runner
      # image without it would pass them without running any.
      - name: Require pwsh for the PowerShell installer tests
        run: |
          if ! pwsh -NoProfile -Command "exit 0"; then
            echo "::error::pwsh is missing on this runner, so the PowerShell installer tests would skip"
            exit 1
          fi
          pwsh --version

      # The test:cli command, split into shards that take about as long as each
      # other. scripts/test-shards.mjs says how, and how to refresh its weights.
      - name: Test CLI
        working-directory: cli
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: node scripts/test-shards.mjs --shard "$SHARD/$SHARD_TOTAL"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build CLI TypeScript
        working-directory: cli
        run: npm run build

      - name: Validate Agent SDK registry
        working-directory: cli
        run: npm run test:agent-sdk:validate

      - name: Run leak probe
        working-directory: cli
        run: node --test tests/hardening-leak-probe.test.mjs

      - name: Check generated integration specs
        working-directory: cli
        run: npm run check:integration-specs

      - name: Test site scripts
        run: npm run test:site

      - name: Build site
        run: npm run build

  verify:
    needs: [cli-tests, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
