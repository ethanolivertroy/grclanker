name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Build CLI TypeScript
        working-directory: cli
        run: npm run build

      - name: Test CLI
        working-directory: cli
        run: npm run test:cli

      - name: Validate Agent SDK registry
        working-directory: cli
        run: npm run test:agent-sdk:validate

      - name: Run leak probe
        working-directory: cli
        run: node --test tests/hardening-leak-probe.test.mjs

      - name: Check generated integration specs
        working-directory: cli
        run: npm run check:integration-specs

      - name: Build Astro site
        run: npm run build
